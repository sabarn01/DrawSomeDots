<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draw Some Dots</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        background: #f4f4f4;
        color: #222;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px 0;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .controls label {
        font-size: 13px;
      }
      .controls input[type="number"] {
        width: 120px;
        padding: 4px;
        font-size: 14px;
      }
      .controls select,
      .controls button {
        padding: 4px 10px;
        font-size: 14px;
      }
      .controls label.range {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      .controls label.range input[type="range"] {
        width: 120px;
      }
      button:disabled,
      input:disabled,
      select:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .progress-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .progress-row label {
        width: 80px;
      }
      progress {
        flex: 1;
        height: 14px;
      }
      #elapsed {
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        margin-bottom: 12px;
      }
      #canvas-wrap {
        position: relative;
        background: white;
        border: 1px solid #ccc;
        padding: 0;
        max-width: 100%;
        height: calc(100vh - 220px);
        overflow: hidden;
      }
      #main {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        cursor: grab;
        touch-action: none;
      }
      #main:active {
        cursor: grabbing;
      }
      #minimap {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 160px;
        height: 100px;
        border: 1px solid #888;
        background: rgba(255, 255, 255, 0.85);
        cursor: crosshair;
        touch-action: none;
        display: none;
      }
      #minimap.visible {
        display: block;
      }
      #hint {
        position: absolute;
        left: 8px;
        top: 8px;
        font-size: 11px;
        color: #666;
        background: rgba(255, 255, 255, 0.85);
        padding: 2px 6px;
        border-radius: 3px;
        pointer-events: none;
      }
      .preview-label {
        font-size: 11px;
        color: #666;
        background: rgba(255, 255, 255, 0.85);
        padding: 1px 6px;
        border-radius: 2px 2px 0 0;
        cursor: move;
        user-select: none;
      }
      #preview-wrap {
        position: absolute;
        left: 8px;
        top: 32px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      #preview-wrap.dragging .preview-label {
        cursor: grabbing;
      }
      #preview {
        width: 160px;
        height: 220px;
        background: white;
        border: 1px solid #888;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Draw Some Dots</h1>
    <div class="controls">
      <label>
        Number:
        <input id="num" type="number" min="1" value="42" />
      </label>
      <label>
        Font:
        <select id="font">
          <option>Comic Sans MS</option>
          <option>Arial</option>
          <option>Georgia</option>
          <option>Courier New</option>
          <option>Impact</option>
          <option>Verdana</option>
        </select>
      </label>
      <label title="Show rejected placement attempts on the current-digit preview">
        <input id="show-misses" type="checkbox" checked />
        Show misses
      </label>
      <button id="go">Go</button>
      <button id="save" disabled>Save PNG</button>
      <button id="reset-view" title="Reset zoom &amp; pan (or double-click canvas / press 0)">Reset view</button>
    </div>
    <div class="progress-row">
      <label>Letter:</label>
      <progress id="pb-letter" value="0" max="1"></progress>
      <span id="pb-letter-txt">0 / 0</span>
    </div>
    <div class="progress-row">
      <label>Total:</label>
      <progress id="pb-total" value="0" max="1"></progress>
      <span id="pb-total-txt">0 / 0</span>
    </div>
    <div id="elapsed">Elapsed: 0.00s</div>
    <div id="canvas-wrap">
      <canvas id="main" tabindex="0"></canvas>
      <canvas id="minimap"></canvas>
      <div id="hint">Wheel: zoom · Drag: pan · Dbl-click / 0: reset · Arrows: pan</div>
      <div id="preview-wrap" title="Live preview of the digit currently being filled">
        <div class="preview-label">Current digit</div>
        <canvas id="preview" width="160" height="220"></canvas>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
